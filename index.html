<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://supereggbert.github.io/aframe-htmlembed-component/dist/build.js"></script>
    <script src="https://unpkg.com/super-hands/dist/super-hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.1.0/dist/aframe-physics-system.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@^4.1.1/dist/aframe-event-set-component.min.js"></script>
     <script src="https://unpkg.com/aframe-proxy-event-component/dist/aframe-proxy-event-component.min.js"></script>
  </head>
  <body>
    <a-scene 
    renderer="antialias: true;
                   colorManagement: true;
                   sortTransparentObjects: true;
                   maxCanvasWidth: 1920;
                   maxCanvasHeight: 1920;"
      xr-mode-ui="XRMode: ar;">
 <!-- Proxy principal -->
<a-sphere 
  class="destino"  
  position="0 0 -3"
  material="shader: standard; color: lightgray"
  event-set__nuevoevento="material.color: yellow"
  event-set__leaveevento="material.color: lightgray"
  event-set__scaleevento="scale: 0.5 0.5 0.5"
  event-set__scaleoutevento="scale: 1 1 1">
</a-sphere>
<a-box 
  class="boton"  
  position="2 0 -3"
  scale="1 1 1"
  event-set__nuevoevento="_event: mouseenter; material.color: blue; scale: 1.2 1.2 1.2"
  event-set__leaveevento="_event: mouseleave; material.color: lightgray; scale: 1 1 1"
  proxy-event__in="event: mouseenter; to: .destino; as: nuevoevento"
  proxy-event__out="event: mouseleave; to: .destino; as: leaveevento"
  proxy-event__scaleevento="event: mouseenter; to: .destino; as: scaleevento"
  proxy-event__scaleoutevento="event: mouseleave; to: .destino; as: scaleoutevento">
</a-box>

  <!-- Cámara con cursor -->
  <a-entity camera look-controls>
  <a-entity cursor="fuse: true; fuseTimeout: 500; objects:.boton"
            position="0 0 -2"
            geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
            material="color: black; shader: flat">
  </a-entity>
</a-entity>
</a-scene>
  </body>
</html>
